<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>くりまるのホームページ</title>

    <style>
    #map-app {
        max-width: 800px;
        margin: 20px 0;
    }

    #map-search {
        width: 65%;
        height: 40px;
        box-sizing: border-box;
    }

    #map-app button {
        height: 40px;
        padding: 0 16px;
        cursor: pointer;
    }

    #map-frame {
        width: 100%;
        height: 450px;
        border: 0;
        margin-top: 12px;
    }
</style>
    </head>
<body>

    <h1>くりまるのホームページ</h1>
    

    <p>ホームページを作ってみました！</p>
    <p>HTMLの練習用です</p>

    <h2>プロフィール</h2>
    <p>ここにプロフィールを書きます。</p>

    <h2>このサイトについて</h2>
    <p>GitHub Pagesを使って公開しています。</p>


    <h2>計算機</h2>

<input type="number" id="num1">
<input type="number" id="num2">

<button onclick="keisan()">計算する</button>

<p>結果：<span id="result">---</span></p>

<script>
function keisan() {

    let num1 = Number(document.getElementById("num1").value);
    let num2 = Number(document.getElementById("num2").value);

    let result = num1 + num2;

    document.getElementById("result").textContent = result;
}
</script>
<h2>地図表示の練習</h2>
    <iframe
    src="https://maps.google.com/maps?q=東京駅&output=embed"
    width="600"
    height="450"
    style="border:0;"
    allowfullscreen=""
    loading="lazy">
</iframe>
    <h2>地図アプリ</h2>

<div id="map-app">

    <input
        type="text"
        id="map-search"
        placeholder="場所を入力（例：仙台駅）">

    <button onclick="searchMap()">検索</button>

    <iframe
        id="map-frame"
        src="https://maps.google.com/maps?q=Sendai%20Station&output=embed"
        loading="lazy"
        allowfullscreen>
    </iframe>

</div>

<script>
function searchMap() {

    let place =
        document.getElementById("map-search").value;

    if (place.trim() === "") {
        alert("場所を入力してください");
        return;
    }

    document.getElementById("map-frame").src =
        "https://maps.google.com/maps?q="
        + encodeURIComponent(place)
        + "&output=embed";
}
</script>
</body>
</html>
